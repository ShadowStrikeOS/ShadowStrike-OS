# ShadowStrike OS tmux configuration.
# Theme: black field, neon green signal. ANSI 256 palette from the theme spec:
# primary 46, secondary 82 and 40, dim 22 and 28, text 120 and 157.
# Red is reserved for real alerts and is not used for decoration here.

# Prefix: Ctrl-a, the classic screen style reach.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mouse on: panes, windows, and scrolling all respond to the mouse.
set -g mouse on

# Vi keys in copy mode and for pane movement.
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Splits that keep the current directory, on keys that show their direction.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Faster escape, bigger history, windows numbered from 1.
set -sg escape-time 10
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# True colour where the terminal offers it.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Status bar: theme greens on black.
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=colour16,fg=colour120"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=colour46,fg=colour16,bold] SHADOWSTRIKE #[bg=colour22,fg=colour157] Epsilon0xCell #[default] "
set -g status-right "#[fg=colour40]#S:#I.#P #[fg=colour28]| #[fg=colour120]%Y-%m-%d #[fg=colour46]%H:%M "
setw -g window-status-format "#[fg=colour28] #I:#W "
setw -g window-status-current-format "#[bg=colour22,fg=colour82,bold] #I:#W #[default]"
setw -g window-status-separator ""

# Panes: dim borders, the active pane in primary green.
set -g pane-border-style "fg=colour22"
set -g pane-active-border-style "fg=colour46"
set -g message-style "bg=colour22,fg=colour157"
setw -g mode-style "bg=colour46,fg=colour16"
